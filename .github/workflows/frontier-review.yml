name: Frontier Experience Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate-evidence:
    name: Frontier candidate evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Check out immutable design kernel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Starlight-Intelligence/starlight-design-intelligence
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
      - name: Install locked validator dependencies
        working-directory: kernel
        run: npm ci --ignore-scripts
      - name: Validate candidate evidence
        env:
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node kernel/scripts/validate-frontier-review.mjs candidate "$CANDIDATE_BASE" "$CANDIDATE_HEAD"
