name: Living product browser checks
on:
  pull_request:
    paths:
      - 'examples/sis-living-library/**'
      - '.github/workflows/living-products.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/sis-living-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/sis-living-library/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run check:budgets
      - name: Capture candidate baselines
        if: ${{ hashFiles('examples/sis-living-library/tests/visual/*.png') == '' }}
        run: UPDATE_SNAPSHOTS=1 npm run test:products
      - name: Compare a second independent render
        run: npm run test:products
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-products-candidate-evidence
          path: |
            examples/sis-living-library/test-results/products/
            examples/sis-living-library/tests/visual/
          retention-days: 3
