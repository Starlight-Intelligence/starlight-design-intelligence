name: Design kernel

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: design-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run validate
      - run: npm run validate:experience
      - run: npm run validate:observatory
      - run: npm run check:observatory-index
      - run: npm test
      - name: Reject incomplete native hook proof
        run: python3 -B -m unittest discover -s tests -p native_codex_probe_test.py
      - name: Install Chromium for rendered foundation checks
        run: npx playwright install --with-deps chromium
      - name: Exercise rendered interface defects and CLI failure behavior
        run: npm run test:interface

  living-library:
    name: Living Library browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/sis-living-library
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: examples/sis-living-library/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload responsive captures and browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: living-library-browser-review
          path: examples/sis-living-library/test-results/
          if-no-files-found: warn
          retention-days: 14
